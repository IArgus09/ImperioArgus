<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Imperio Argus</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #07090f;
      color: #f5d77a;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at center, #182238 0%, #090c14 45%, #030407 100%);
    }

    .imperio {
      max-width: 900px;
      width: 100%;
    }

    .corona {
      font-size: 70px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(55px, 15vw, 120px);
      letter-spacing: 12px;
      color: #d9ad45;
      text-shadow: 0 0 25px rgba(217, 173, 69, .35);
    }

    .linea {
      width: 180px;
      height: 2px;
      background: #d9ad45;
      margin: 20px auto;
    }

    .subtitulo {
      color: #d7d9df;
      font-size: 20px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .botones {
      margin-top: 45px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .botones a {
      text-decoration: none;
      color: #f5d77a;
      border: 1px solid #b88b2d;
      padding: 14px 25px;
      border-radius: 5px;
      background: rgba(20, 24, 35, .8);
      transition: .2s;
    }

    .botones a:hover {
      background: #b88b2d;
      color: #07090f;
    }

    section {
      padding: 70px 25px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    h2 {
      color: #d9ad45;
      font-size: 32px;
      margin-bottom: 20px;
    }

    p {
      color: #c7c9d0;
      line-height: 1.7;
      font-size: 17px;
    }

    .tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 35px;
    }
